<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>家族视频 · 钟国华家族记忆</title>
    <style>
      :root { --ink:#34281f; --muted:#79695d; --paper:#f8f3e9; --red:#9d3524; --gold:#d8aa55; --line:#dfd0bb; --white:#fffdf8; }
      * { box-sizing:border-box; }
      html { scroll-behavior:smooth; }
      body { margin:0; color:var(--ink); background:var(--paper); font-family:"Noto Serif SC","Songti SC","STSong",serif; line-height:1.85; }
      .wrap { width:min(900px, calc(100% - 40px)); margin:auto; }
      header { background:var(--white); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
      .nav { min-height:60px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
      .brand { font-size:17px; font-weight:700; letter-spacing:.08em; text-decoration:none; color:var(--red); white-space:nowrap; }
      nav { display:flex; gap:18px; flex-wrap:wrap; justify-content:flex-end; }
      nav a { color:var(--ink); text-decoration:none; font-size:14px; }
      nav a:hover { color:var(--red); }
      .hero { padding:60px 0 40px; text-align:center; border-bottom:1px solid var(--line); }
      .eyebrow { margin:0 0 12px; font-size:13px; letter-spacing:.22em; color:var(--red); }
      h1 { font-size:clamp(28px,4vw,40px); line-height:1.2; margin:0 0 16px; letter-spacing:.08em; font-weight:500; }
      .subtitle { color:var(--muted); font-size:16px; margin:0; }
      main { padding:50px 0 80px; }
      .video-container { background:var(--white); border:1px solid var(--line); border-radius:8px; padding:20px; box-shadow:0 4px 20px rgba(0,0,0,.08); }
      video { width:100%; border-radius:4px; display:block; }
      .video-info { margin-top:24px; padding:20px; background:var(--paper); border-left:3px solid var(--gold); border-radius:0 4px 4px 0; }
      .video-title { margin:0 0 10px; font-size:18px; font-weight:500; }
      .video-desc { margin:0; color:var(--muted); font-size:15px; }
      .tip { margin-top:30px; padding:16px 20px; background:#fff3e0; border-radius:6px; font-size:14px; color:#795548; }
      footer { border-top:1px solid var(--line); padding:30px 0 40px; color:var(--muted); font-size:14px; text-align:center; }
      @media (max-width:600px) { .nav { padding:12px 0; align-items:flex-start; flex-direction:column; } nav { gap:12px; } .hero { padding:40px 0 30px; } }
    </style>
  </head>
  <body>
    <header><div class="wrap nav"><a class="brand" href="index.html">钟国华家族记忆</a><nav><a href="index.html">返回首页</a><a href="album.html">照片相册</a><a href="story.html">自传故事</a></nav></div></header>

    <main class="wrap">
      <div class="video-container">
        <video controls playsinline>
          <source src="videos/family-video.mov" type="video/quicktime">
          您的浏览器不支持视频播放，请下载后观看。
        </video>
      </div>
      <div class="video-info">
        <p class="video-title">家族珍贵视频</p>
        <p class="video-desc">这是一段珍贵的家族视频记录，保存了美好的时光记忆。点击播放按钮即可观看，视频有声音。</p>
      </div>
      <div class="tip">
        💡 小提示：如果视频播放不流畅或者没有声音，可以试试用不同的浏览器打开（比如Safari、Chrome、Edge）。苹果手机和电脑上用Safari浏览器播放效果最好。
      </div>
    </main>
    <footer><div class="wrap">钟国华家族记忆 · 为家人保存，为后人传承</div></footer>
  </body>
</html>

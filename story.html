* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:"Songti SC","Noto Serif CJK SC","STSong",serif; line-height:2; padding:18px; }

.back { display:inline-block; color:var(--red); text-decoration:none; margin-bottom:18px; font-size:15px; }
h1 { text-align:center; color:var(--red); font-size:clamp(30px,5vw,44px); margin:4px 0 8px; letter-spacing:.08em; }
.period { text-align:center; color:var(--muted); font-size:15px; margin-bottom:26px; }
.lead { background:#f8f0e2; border-left:4px solid var(--navy); padding:14px 18px; margin:0 0 28px; color:var(--navy); text-align:center; font-size:24px; font-weight:600; letter-spacing:.12em; }
.chapter-structure { margin:0 0 30px; padding:22px 24px 18px; border:1px solid var(--line); border-radius:8px; background:#fbf7ef; }
.chapter-structure h2 { margin:0 0 14px; text-align:center; color:var(--navy); font-size:22px; font-weight:600; }
.chapter-list { margin:0; padding:0; list-style:none; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 18px; }
.chapter-list li { color:var(--navy); padding:7px 10px; border-bottom:1px solid var(--line); font-size:17px; }
.chapter-list .num { display:inline-block; min-width:28px; color:var(--red); font-weight:600; }
.memoir-text { white-space:pre-wrap; word-break:break-word; font-size:18px; line-height:2; }
.bottom-nav { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:54px; padding-top:28px; border-top:1px solid var(--line); }
.bottom-nav a { display:inline-block; min-width:130px; padding:10px 20px; border:1px solid var(--navy); border-radius:7px; color:var(--navy); background:#f8f5ee; text-decoration:none; text-align:center; font-size:16px; }
.bottom-nav a:hover { background:var(--navy); color:#fff; }
footer { text-align:center; color:var(--muted); border-top:1px solid var(--line); margin-top:28px; padding-top:24px; font-size:14px; }
@media(max-width:600px) {

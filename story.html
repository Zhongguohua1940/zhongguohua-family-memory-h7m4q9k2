<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="钟国华自传——我的回忆录">
<title>钟国华自传 · 我的回忆录</title>
<style>
:root {
  --ink:#34281f; --muted:#79695d; --paper:#f7f1e6; --red:#963a2b;
  --navy:#17324d; --line:#dfd0bb; --white:#fffdf8;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:"Songti SC","Noto Serif CJK SC","STSong",serif; line-height:2; padding:18px; }
.container { max-width:900px; margin:0 auto; background:var(--white); padding:clamp(22px,5vw,58px); border-radius:10px; box-shadow:0 5px 24px rgba(0,0,0,.08); }
.back { display:inline-block; color:var(--red); text-decoration:none; margin-bottom:18px; font-size:15px; }
h1 { text-align:center; color:var(--red); font-size:clamp(30px,5vw,44px); margin:4px 0 8px; letter-spacing:.08em; }
.period { text-align:center; color:var(--muted); font-size:15px; margin-bottom:26px; }
.lead { background:#f8f0e2; border-left:4px solid var(--navy); padding:14px 18px; margin:0 0 28px; color:var(--navy); text-align:center; font-size:24px; font-weight:600; letter-spacing:.12em; }
.toc { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 18px; margin:0 0 40px; padding:22px 24px 18px; background:#fbf7ef; border:1px solid var(--line); border-radius:8px; }
.toc a { color:var(--navy); text-decoration:none; padding:9px 10px; border-bottom:1px solid var(--line); font-size:17px; transition:.15s; }
.toc a:hover { color:var(--red); background:#f8f0e2; }
.toc .num { display:inline-block; min-width:30px; color:var(--red); font-weight:600; }
section { scroll-margin-top:20px; margin-top:46px; }
h2 { color:var(--navy); border-left:5px solid var(--red); padding:8px 0 8px 15px; margin:0 0 20px; font-size:clamp(24px,4vw,31px); line-height:1.4; }
h2 span { font-family:Arial,sans-serif; font-size:.55em; color:#a58a70; margin-right:12px; vertical-align:middle; }
h3 { color:var(--red); font-size:20px; margin:28px 0 10px; }
p { text-indent:2em; margin:0 0 1.05em; font-size:18px; }
figure.photo { margin:30px auto; text-align:center; }
figure.photo img { max-width:min(620px,100%); height:auto; border:1px solid var(--line); border-radius:6px; padding:8px; background:#fff; box-shadow:0 3px 12px rgba(0,0,0,.07); }
figure.photo figcaption { font-size:15px; color:var(--muted); margin-top:10px; line-height:1.8; text-indent:0; }
.bottom-nav { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:54px; padding-top:28px; border-top:1px solid var(--line); }
.bottom-nav a { display:inline-block; min-width:130px; padding:10px 20px; border:1px solid var(--navy); border-radius:7px; color:var(--navy); background:#f8f5ee; text-decoration:none; text-align:center; font-size:16px; }
.bottom-nav a:hover { background:var(--navy); color:#fff; }
footer { text-align:center; color:var(--muted); border-top:1px solid var(--line); margin-top:28px; padding-top:24px; font-size:14px; }
@media(max-width:600px) {
  body { padding:8px; }
  .container { padding:22px 17px; }
  .toc { grid-template-columns:1fr; }
  .lead { font-size:21px; letter-spacing:.08em; }
  p { font-size:17px; line-height:1.95; }
  .bottom-nav a { min-width:120px; }
  figure.photo { margin:22px auto; }
}
</style>
</head>
<body>
<main class="container">
  <a class="back" href="index.html">← 返回家庭网站首页</a>
  <h1>钟国华自传</h1>
  <div class="period">1940 — 2026 · 我的回忆录</div>
  <div class="lead">岁月留痕 · 家族记忆 · 薪火相传</div>

  <nav class="toc" id="toc" aria-label="自传十一部分目录">
    <a href="#ch1"><span class="num">1.</span>童年时代</a>
    <a href="#ch2"><span class="num">2.</span>少年时代</a>
    <a href="#ch3"><span class="num">3.</span>中学时代</a>
    <a href="#ch4"><span class="num">4.</span>青春时代</a>
    <a href="#ch5"><span class="num">5.</span>乡村教书</a>
    <a href="#ch6"><span class="num">6.</span>文化大革命</a>
    <a href="#ch7"><span class="num">7.</span>县城执教</a>
    <a href="#ch8"><span class="num">8.</span>科技探索和计算机</a>
    <a href="#ch9"><span class="num">9.</span>办公司</a>
    <a href="#ch10"><span class="num">10.</span>退休生活</a>
    <a href="#ch11"><span class="num">11.</span>晚年生活</a>
  </nav>

  <div id="memoir"><p>正在载入自传……</p></div>

  <nav class="bottom-nav" aria-label="自传末尾导航">
    <a href="#toc">↑ 返回目录</a>
    <a href="index.html">⌂ 返回主页</a>
    <a href="guestbook.html">✎ 观后留言</a>
  </nav>
  <footer>愿往事不被遗忘 · 愿亲情代代相传</footer>
</main>
<script>
/*
 * 11个目录按钮对应11个正文锚点。
 * 重要：这里不修改8.18版自传原文；只在原文对应的起始句之前显示章节标题，
 * 并保留该起始句本身，因此不会丢失原文字句。
 *
 * 【2026-08-28 更新】按照桌面版《自传 8:20.pages》的排版，在自传原文的
 * 相应位置插入照片（位置、内容、数量与电脑里的版本一致，视频暂未加入）。
 * 其中 4 张照片（计算机小组合影、青年照片、邮轮合影、手机截图）为本仓库
 * 新增文件，存放在仓库根目录；其余照片引用本仓库已有的图片文件。
 */
const chapters = [
  ['童年时代','我是1940年3月11日'],
  ['少年时代','后来父亲由江津师范调到璧山师范去教书'],
  ['中学时代','1956年夏，考高中'],
  ['青春时代','1959年一1961年'],
  ['乡村教书','两年读书很快混过去了！'],
  ['文化大革命','1966年遇上文化大革命'],
  ['县城执教','我去宣传部报到时'],
  ['科技探索和计算机','在邻水中学教书期间'],
  ['办公司','那时政府鼓励下海办厂经商'],
  ['退休生活','2000年我正式退休'],
  ['晚年生活','我的理财历程']
];

const subheads = new Set([
  '1. 同窗挚友与五四运动',
  '2. 结伴赴法勤工俭学',
  '3. 革命牺牲与深切缅怀',
  '二、我父亲钟泽普这次农民起义中的具体工作：'
]);

/* ===== 照片插入配置（与电脑版自传的位置一一对应） ===== */
/* 自传最前面的照片（对应标题页） */
const photoTop = [
  'images/pic - 12.jpeg'
];
/* 插在某段文字之前的照片（该段开头文字 → 图片） */
const photoBefore = {
  '我在学校还组建了计算机小组': '自传-计算机小组.jpg',
  '买了一台老年电动四轮车': 'images/pic - 1.jpeg'
};
/* 插在某段文字之后的照片（该段开头文字 → 图片） */
const photoAfter = {
  '我是1940年3月11日': 'images/pic - 20.jpeg',
  '父亲在昆明建的银行': 'images/pic - 8.jpeg',
  '1958年大跃进': '自传-青年照片.jpg',
  '整个文化大革命期间': 'images/pic - 16.jpeg',
  '我父亲于1997年8月1日': 'images/pic - 19.jpeg',
  '2021年，因为岛上': '自传-邮轮合影.jpg',
  '但是没过多久': '自传-手机截图.jpg'
};
/* 自传末尾的照片及文字说明（对应电脑版文末） */
const photoEnd = [
  ['新相片.jpeg', '左边第一排从左到右是亲家，唐伦，我，第二排从左到右彭宇浩，钟慧，彭飞，钟一鸣，杨梅，中间的小孩钟与杨'],
  ['images/pic - 2.jpeg', '这是在日本广岛的广场上拍的照片，相片当中那个塑像，手指天空，表示纪念广岛被原子弹轰炸，让人们永远记住。']
];

const esc = s => s.replace(/[&<>"']/g, c => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
}[c]));

const fig = (src, cap) =>
  '<figure class="photo"><img src="' + src + '" alt="' + esc(cap || '自传照片') +
  '" loading="lazy">' + (cap ? '<figcaption>' + esc(cap) + '</figcaption>' : '') + '</figure>';

fetch('自传 8:18.txt?v=20260829', { cache:'no-store' })
  .then(r => { if (!r.ok) throw new Error('text'); return r.text(); })
  .then(text => {
    const lines = text
      .replace(/^\uFEFF/, '')
      .split(/\r?\n/)
      .map(s => s.trim())
      .filter(Boolean)
      .filter(s => s !== '我的回忆录（8.18版）');

    let html = photoTop.map(s => fig(s)).join('');

    const addPhotos = (map, line) => {
      Object.keys(map).forEach(k => { if (line.startsWith(k)) html += fig(map[k]); });
    };

    let current = -1;
    const found = new Array(chapters.length).fill(false);

    lines.forEach(line => {
      /* 段落之前的照片 */
      addPhotos(photoBefore, line);

      const idx = chapters.findIndex(c => !found[chapters.indexOf(c)] && line.startsWith(c[1]));

      if (idx >= 0) {
        if (current >= 0) html += '</section>';
        current = idx;
        found[idx] = true;
        html += '<section id="ch' + (idx + 1) + '">';
        html += '<h2><span>' + String(idx + 1).padStart(2, '0') + '</span>' + esc(chapters[idx][0]) + '</h2>';
        // 起始句照原文显示，绝不丢弃。
        html += '<p>' + esc(line) + '</p>';
        addPhotos(photoAfter, line);
        return;
      }

      if (line.startsWith('一个家庭要过得幸福')) {
        html += '<h3>一个家庭要过得幸福</h3>';
        html += '<p>' + esc(line) + '</p>';
        addPhotos(photoAfter, line);
        return;
      }

      if (subheads.has(line)) {
        html += '<h3>' + esc(line) + '</h3>';
        html += '<p>' + esc(line) + '</p>';
        addPhotos(photoAfter, line);
        return;
      }

      html += '<p>' + esc(line) + '</p>';
      addPhotos(photoAfter, line);
    });

    if (current >= 0) html += '</section>';

    /* 文末照片及说明 */
    photoEnd.forEach(([src, cap]) => { html += fig(src, cap); });

    document.getElementById('memoir').innerHTML = html;
  })
  .catch(() => {
    document.getElementById('memoir').innerHTML = '<p>自传文本暂时无法载入，请稍后再打开页面。</p>';
  });
</script>
</body>
</html>

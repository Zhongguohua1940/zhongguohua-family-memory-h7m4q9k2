</style></head><body><main class="container"><a class="back" href="index.html">← 返回家庭网站首页</a><h1>钟国华自传</h1><div class="period">1940 — 2026 · 我的回忆录</div><div class="lead">岁月留痕 · 家族记忆 · 薪火相传</div><nav class="toc" id="toc" aria-label="目录"></nav><div id="memoir"><p>正在载入自传……</p></div><footer>愿往事不被遗忘 · 愿亲情代代相传</footer></main><script>

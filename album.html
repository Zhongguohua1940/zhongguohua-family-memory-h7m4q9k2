<title>家族相册</title>
<style>

body{background:#f7f7f7;font-family:"PingFang SC",sans-serif;padding:20px;}
h1{text-align:center;margin-bottom:30px;color:#333;}
.gallery{
  display:grid;
  grid-template-columns:repeat(auto‑fill,minmax(220px,1fr));
  gap:16px;
  max-width:1200px;
  margin:0 auto;
}
.gallery-item{
  background:#fff;
  padding:10px;
  border-radius:8px;
  box-shadow:0 2px 8px #00000015;
}
.gallery-item img{
  width:100%;
  height:auto;
  display:block;
  border-radius:4px;
}
.back{
  display:block;
  text-align:center;
  margin:30px 0;
  font-size:18px;
}
.back a{color:#2563eb;text-decoration:none;}
</style>
</head>
